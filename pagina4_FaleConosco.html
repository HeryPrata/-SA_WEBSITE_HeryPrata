    <main>
        <h1> Fala Conosco </h1>
    <section class="bloco">
        <div class="formulario">
            <div class="formulario-filho">
                <!-- LABEL = ELEMENTO QUE DEVE TER INTERAÇÃO DO USER -->
                <!-- PLACEHOLDER =  MENSAGEM DE TEXTO PARA O USER-->
                <form action="">
                <section class="cabecalho-formulario">
                    <p>
                        <label for="nome"> Nome:</label>
                        <input type="text" name="nome" id="nome" placeholder="Digite Seu Nome" required>
                    </p>

                    <p>
                        <label for="email"> Email:</label>
                        <input type="email" name="email" id="email" placeholder="Digite Seu Email" required>
                    </p>

                     <p>
                        <label for="telefone"> Telefone:</label>
                        <input type="tel" name="telefone" id="telefone" placeholder="Digite Seu Telefone" >
                        
                    </p>

                    <p>
                        <label for="assunto"> Assunto:</label>
                        <input type="text" name="assunto" id="assunto">
                    </p>
                </section>

                <section class="bloco-mensagem">
                    <p>
                        <label for="mensagem"> Mensagem: </label>
                        <textarea name="mensagem" id="mensagem" cols="50" rows="5"></textarea>

                    </p>
                </section>
                    
                    <button class="botao">Enviar</button>
                </form>
            </div>
        </div>
    </section>
        
    </main>

    <footer>
        <section class="bloco">
      <div class="rodape">
        <p>E-mail: contato@summerbeatsfestival.com.br</p>
       
        <p>Telefone: (11) 99876-5432</p>

        <p>2026</p>
      </div>
    </section>
    </footer>
</body>
