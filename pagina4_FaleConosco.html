    <main>
        <h1> Fala Conosco </h1>
    <section class="bloco">
        <div class="formulario">
            <div class="formulario-filho">
                <!-- LABEL = ELEMENTO QUE DEVE TER INTERAÇÃO DO USER -->
                <!-- PLACEHOLDER =  MENSAGEM DE TEXTO PARA O USER-->
                <form action="">
                    <p>
                        <label for="nome"> Nome:</label>
                        <input type="text" name="nome" id="nome" required placeholder="Digite seu nome" required>
                    </p>

                    <p>
                        <label for="email"> Email:</label>
                        <input type="text" name="email" id="email" placeholder="Digite seu email" required>
                    </p>

                     <p>
                        <label for="telefone"> Telefone:</label>
                        <input type="number" name="telefone" id="telefone">
                    </p>

                    <p>
                        <label for="assunto"> Assunto:</label>
                        <input type="text" name="assunto" id="assunto">
                    </p>

                    <p>
                        <textarea name="mensagem" id="mensagem" cols="50" rows="5" placeholder="Escreva a sua mensagem">  </textarea>
                    </p>

                </form>
            </div>
        </div>
    </section>
        
    </main>
